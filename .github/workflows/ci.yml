name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/match.js
          node --check lib/client.js
      # matcher unit tests + engine integration tests (fake Cordis context, all routes
      # and listeners) + source-level contract canaries. The dsh API-surface check
      # inside contract.test.mjs skips here because no dsh installation is present;
      # run `npm test` locally after upgrading dsh to get that comparison.
      - name: Tests
        run: npm test
